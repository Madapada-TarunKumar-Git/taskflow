spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#    properties:
#      hibernate:
#        format_sql: true

server:
  port: 7600
  servlet:
    context-path: /tasks

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha
    enable-deep-linking: true
    show-extensions: true

  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    io.jsonwebtoken: WARN
  file:
    name: logs/tasks.log

management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics"


jwt:
  token:
    secret: ${SECRET}
    expiry: 360000