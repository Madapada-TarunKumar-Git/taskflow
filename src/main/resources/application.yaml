spring:
  application:
    name: taskflow
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/taskflow_db?currentSchema=task
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
#        format_sql: true

server:
  port: 7600

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha

  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
  file:
    name: logs/tasks.log